[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldreel"
version = "0.0.1"
description = "Reverse-engineer any video into a world you can step into."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "jsonschema>=4.23",
    "cryptography>=43",
    "opencv-python-headless>=4.9,<6",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-jsonschema", "scipy-stubs"]

[tool.setuptools.packages.find]
include = ["formats*", "pipeline*", "stages*", "tools*", "eval*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["player"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["formats", "pipeline", "stages", "tools", "eval", "training", "tests"]
# Runs inside Blender against the untyped bpy API; covered by the Blender integration test.
exclude = ['tools/blender/gen_scene\.py']

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true
